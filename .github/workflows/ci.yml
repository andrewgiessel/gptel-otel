name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.1"
          - "30.1"

    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@v5.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install dependencies
        run: |
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(setq package-user-dir (expand-file-name \".ci-elpa\" default-directory))" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'gptel)" \
            --eval "(package-install 'gptel-agent)" \
            --eval "(package-install 'package-lint)"

      - name: Test and compile
        run: |
          make clean test compile ELPA_DIR=.ci-elpa

      - name: Check documentation
        run: |
          emacs -Q --batch \
            --eval "(progn (require 'package) (setq package-user-dir (expand-file-name \".ci-elpa\")) (package-initialize))" \
            -L . \
            --eval "(progn (require 'checkdoc) (let ((checkdoc-force-docstrings-flag nil)) (checkdoc-file \"gptel-otel-core.el\") (checkdoc-file \"gptel-otel-transport.el\") (checkdoc-file \"gptel-otel.el\")))"

      - name: Package lint
        run: |
          make lint ELPA_DIR=.ci-elpa
